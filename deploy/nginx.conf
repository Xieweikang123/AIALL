# AIALL nginx 反代片段（方案 A：nginx 托管前端 dist + 反代后端）
#
# 适用：本机用 nginx 托管前端 `dist/`，并把后端请求转发给本地 agent-server。
# 方案 B（直连）见 README.md：不走 nginx，前端构建时用 VITE_BACKEND_URL=http://<IP>:8088。
#
# 关键点：
#   - agent-server 监听 127.0.0.1:8787（见 agent-server.service）
#   - SSE 必须 proxy_buffering off，否则 /api/agent/run 流式事件会被 nginx 缓存
#   - 认证：Authorization 头要透传（proxy_pass 默认透传）

server {
    listen 8088;
    server_name _;

    # 前端静态产物（`npm run build:tauri` 生成的 dist/，上传到 /opt/aiall/dist）
    root /opt/aiall/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Agent 流式（SSE）：关闭缓冲，防止事件被积压
    location /api/agent/run {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Aiall-Token $http_x_aiall_token;
    }

    location /api/agent/cancel {
        proxy_pass http://127.0.0.1:8787;
    }

    # 服务端配置 / 登录
    location /api/server/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Authorization $http_authorization;
    }

    # 后端业务接口
    location /backend/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Aiall-Token $http_x_aiall_token;
        # web/extract 是 SSE（progress + result），同样关缓冲
        proxy_buffering off;
    }
}
