[package]
name = "app"
version = "0.1.0"
description = "AIALL desktop agent"
authors = ["AIALL"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.80"
default-run = "app"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agent-smoke"
path = "src/bin/agent_smoke.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
regex = "1"
walkdir = "2"
notify = "6"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
image = "0.25"
rand = "0.8"
urlencoding = "2"
headless_chrome = "1.0"
